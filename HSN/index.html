  try{if(x.p.s){old.push(...await rekey(x.p,S.skey,S.key));delete x.p.s;S.meta.safe.items=S.meta.safe.items.filter(q=>q.id!==id);delete S.urls[id];delete S.th[id]}else S.meta.folders[x.f]=S.meta.folders[x.f].filter(q=>q.id!==id);
   S.meta.folders[to].push(x.p);await saveMeta()}catch(e){if(e===0)return}}
 await fin(old)}
function moveSheet(){const ks=Object.keys(S.meta.folders),n=S.sel.size;return`<div class="sheet" onclick="S.mv=false;render()"><div class="card st" onclick="event.stopPropagation()"><h2>Move ${n} item${n==1?"":"s"} to</h2>${ks.map((k,i)=>`<button style="width:100%;margin:4px 0" onclick="moveTo(${i})">${esc(k)}</button>`).join("")}${S.safeOn?"":`<button class="p" style="width:100%;margin:4px 0" onclick="moveTo(-1)">Safe</button>`}<button class="link" onclick="S.mv=false;render()">Cancel</button></div></div>`}
function renderV(){const v=$("vw"),on=!!S.big&&S.view==="gal"&&!S.set&&!S.sv;v.innerHTML=on?viewer():"";document.body.classList.toggle("nos",on||!!S.mv||!!S.menu);if(on)showBig();bump()}
function closeV(){S.big=null;renderV()}
function guideScreen(){const st=[["Sign in with Google","Your photos live in a hidden app folder in your own Google Drive. Nobody else can see them."],["Set a passcode","You enter it every time you open the app. The app locks itself after a while, or tap Lock."],["Save your recovery code","It is shown once. It is the only way to reset a forgotten passcode. If you lose both, nobody can open your photos."],["Add photos and videos","Open a folder and tap + Add. Create folders on the home screen, and rename one with the pencil button."],["Work with many at once","Tap Select, pick items, then choose Delete, Move, Share or Download."],["Deleted by mistake?","Open Recently deleted and tap Restore. Photos return to their own folder. Delete forever removes them for good."],["Favorites","Open a photo and tap the heart. Find all your favorites on the home screen."],["The Safe","A second lock for your most private photos. Select photos, tap Move, then Safe. If you forget the Safe passcode, reset it with your main passcode."],["Use it on other devices","Sign in with the same Google account and enter your passcode."],["Install on your phone","Open the site in Chrome or Safari and choose Add to Home Screen."]];
 return`<header class="top"><div class="tl"><button class="ic" aria-label="Back" onclick="S.view=S.gback||'in';render()">←</button><div><h1>How it works</h1><small>A quick guide</small></div></div></header><div class="card st">${st.map(([t,d],i)=>`<div class="gs"><b>${i+1}. ${t}</b><p>${d}</p></div>`).join("")}</div>`}
const avatar=a=>a.pic?`<img class="avimg" src="${esc(a.pic)}" alt="" referrerpolicy="no-referrer">`:`<span class="avimg">${esc(((a.name||a.email||"?")[0]||"?").toUpperCase())}</span>`;
function acct(){try{return JSON.parse(localStorage.getItem("hs-acct")||"null")}catch(e){return null}}
async function profile(){try{const r=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+S.tok}});if(!r.ok)return null;const j=await r.json();return{name:j.name||"",email:j.email||"",pic:j.picture||""}}catch(e){return null}}
async function signIn(prompt,hint){try{S.err="";await getTok(prompt,hint);S.me=await profile();if(S.me)try{localStorage.setItem("hs-acct",JSON.stringify(S.me))}catch(e){}await loadMeta();S.view="pass";render()}
 catch(x){if(x!==0)err("Google sign-in did not finish ("+((x&&(x.type||x.error||x.message))||"unknown reason")+"). Check the client ID setup and try again.")}}
function signBtn(){const a=acct();return a?`<div class="me">${avatar(a)}<div><b>${esc(a.name||a.email)}</b><small>${esc(a.email)}</small></div></div><button class="p" onclick="signIn('',acct().email)">Continue as ${esc((a.name||"").split(" ")[0]||"you")}</button><p class="note"><button class="link" onclick="signIn('select_account')">Use another account</button></p>`:`<button class="p" onclick="signIn()">Continue with Google</button>`}
function resetState(){S.tok=null;S.meta=null;S.metaId=null;S.key=null;S.skey=null;S.safeOn=false;S.sv="";S.th={};S.pack={};S.packP=null;S.urls={};S.cur=null;S.set=false;S.trash=false;S.fav=false;S.big=null;S.selMode=false;S.sel=new Set();S.menu=false;S.mv=false;S.exp=0;S.err="";S.me=null;S.view="in"}
function signOut(){resetState();render()}
function switchAcct(){resetState();render();signIn("select_account")}
function forgetAcct(){try{google.accounts.oauth2.revoke(S.tok,()=>{})}catch(e){}try{localStorage.removeItem("hs-acct")}catch(e){}resetState();render()}
async function reconnect(){try{await getTok("",S.me&&S.me.email);S.exp=0;S.err="";render();try{S.pdirty?await savePack():await saveMeta()}catch(e){}}catch(x){err("Could not reconnect. Try again.")}}
function acctMenu(){const a=S.me||{};return`<div class="sheet" onclick="S.menu=false;render()"><div class="card st" onclick="event.stopPropagation()"><div class="me">${avatar(a)}<div><b>${esc(a.name||"Your account")}</b><small>${esc(a.email||"")}</small></div></div><button style="width:100%;margin:10px 0 4px" onclick="switchAcct()">Switch account</button><button style="width:100%;margin:4px 0" onclick="signOut()">Sign out</button><p class="note">Sign out keeps this account on the sign-in screen so you can continue with one tap.</p><button class="link danger" onclick="forgetAcct()">Sign out and forget this device</button> <button class="link" onclick="S.menu=false;render()">Close</button></div></div>`}
let sx=0;addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
addEventListener("touchend",e=>{if(S.big&&e.target.tagName!=="VIDEO"){const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60)nav(d<0?1:-1)}});
addEventListener("keydown",e=>{if(!S.big)return;if(e.key==="ArrowRight")nav(1);if(e.key==="ArrowLeft")nav(-1);if(e.key==="Escape")closeV()});
function render(){const vk=[S.view,S.cur,S.trash,S.fav,S.set,S.reset,S.sv,S.safeOn].join();const same=vk===S.vk,y=globalThis.scrollY||0;if(!same){S.shown=10;S.nf={}}let h="";const e=`<p class="msg" role="alert">${esc(S.err)}</p>`;
 if(S.view==="in")h=`<div class="card"><img class="logo" src="icon.svg" alt=""><h1>Hide&amp;Seek</h1><p>Your private photo gallery. Photos are encrypted and saved in your own Google Drive.</p>${e}${signBtn()}<p class="note"><button class="link" onclick="S.gback='in';S.view='guide';render()">How it works</button> · <a href="privacy.html" style="color:var(--ac)">Privacy policy</a></p></div>`;
 else if(S.view==="load")h=`<div class="splash"><img class="logo pulse" src="icon.svg" alt=""><h1>Welcome back</h1><p>Opening your vault…</p><div class="prog"><i></i></div></div>`;
 else if(S.view==="guide")h=guideScreen();
 else if(S.view==="rc")h=`<div class="card"><h1>Save your recovery code</h1><p>This is the only way to reset your passcode if you forget it. It is shown once. If you lose both, nobody can open your photos.</p><p class="code">${S.rc}</p><button onclick="navigator.clipboard&&navigator.clipboard.writeText(S.rc)">Copy code</button><p><label><input id="ok" type="checkbox" style="width:auto;margin-right:8px">I saved my recovery code somewhere safe</label></p>${e}<button class="p" onclick="rcDone()">Continue</button></div>`;
 else if(S.view==="pass"&&S.reset)h=`<div class="card"><h1>Reset passcode</h1><p>Enter your recovery code and choose a new passcode. Your photos stay safe.</p><label for="r">Recovery code</label><input id="r" autocomplete="off"><label for="p">New passcode</label><input id="p" type="password" autocomplete="off"><label for="q">Confirm new passcode</label><input id="q" type="password" autocomplete="off">${e}<button class="p" onclick="resetGo()">Reset passcode</button> <button class="link" onclick="S.reset=false;S.err='';render()">Back</button></div>`;
 else if(S.view==="pass"){const set=!S.meta;
  h=`<div class="card"><h1>${set?"Set your passcode":"Enter your passcode"}</h1><p>${set?"You will enter it each time you open your gallery.":"Unlock your gallery."}</p><label for="p">Passcode</label><input id="p" type="password" autocomplete="off">${set?'<label for="q">Confirm passcode</label><input id="q" type="password" autocomplete="off">':""}${e}<button class="p" onclick="passGo()">${set?"Save passcode":"Unlock"}</button>${set?"":' <button class="link" onclick="forgot()">Forgot passcode?</button>'}</div>`}
 else h=gallery();
 app.className=vk!==S.vk?"anim":"";S.vk=vk;app.innerHTML=h;if(globalThis.scrollTo)scrollTo(0,same?y:0);if(S.view==="gal")thumbs();renderV();bump()}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
